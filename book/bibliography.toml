# Canonical bibliographic metadata for the book build.
#
# Most metadata is parsed from the source registers (REFERENCES.md,
# PAPER_READING_PATH.md, FRONTIER_RESEARCH.md), which stay the single place
# where sources, their use, scope/caution notes and verification dates are
# recorded. Entries here only:
#   * group several URLs into one work (`match` = URL prefixes), e.g. the
#     sections of one textbook, so the bibliography lists the work once;
#   * supply fuller author names, titles, venues or DOIs;
#   * give software documentation a descriptive in-text label (`cite_text`).
# A manuscript link whose URL matches an entry is cited as that work.
# Fields: match, authors, cite, year, title, venue, url, doi, cite_text.

